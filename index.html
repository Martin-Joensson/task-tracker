<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="module" src="./dist/app.js"></script>
    <script type="module" src="./dist/fetch.js"></script>
    <!-- <script type="module" src="./dist/marathon.js"></script> -->
    <!-- <script type="module" src="./dist/quiz.js"></script> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header" class="content-grid full-width">
      <h1 id="title"></h1>
    </header>

    <div class="main content-grid">
      <section id="task-grid" class="card-grid"></section>
      <section class="dog-section">
        <h2>can i pet that dawg?</h2>
        <p id="dog-loading">Loading...</p>
        <img id="dog-image" hidden src="" alt="No dog loaded yet" />
        <button id="dog-button">Get me a new dog!</button>
        <div class="flex flex-col">
          <label> Search: </label>
          <input type="text" id="breed-search" placeholder="Search breeds..." />
          <label for="breed-select">Breed: </label>
          <select id="breed-select">
            <option value="random" default>Random</option>
          </select>
        </div>
      </section>
    </div>
    <footer id="footer"></footer>
  </body>
</html>
